<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>LibLookup</title>
  </head>
  <body>
    <h3>LibLookup</h3>
    <form id="queryForm">
      <p>Catalog:
        <select title="Catalog" name="catalog" id="catalog">
          <option value="WorldCat">WorldCat</option>
          <option value="AlmaProd">Alma Production</option>
          <option value="AlmaSand">Alma Sandbox</option>
      </select>
      <input 
        title="Z390 query string" 
        placeholder='Record #' 
        type="text" 
        id="queryString"
        name="q"
        size="20"
      />
      </p>
      <p><button id="submit" type="submit">Search</button></p>
    </form>
    <p id='results'>
      <script src ="./renderer.js"></script>
    </p>
  </body>
</html>
