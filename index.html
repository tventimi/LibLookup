<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./style.css" type="text/css"/>
    <title>LibLookup</title>
  </head>
  <body>
    <h3>LibLookup</h3>
    <form id="queryForm">
      <p>Catalog:
        <select title="Catalog" name="catalog" id="catalog"></select>
      <br/>
      Query:
      <input 
        title="Z39.50 query string" 
        placeholder='Keyword or Z39.50 query string' 
        type="text" 
        id="queryString"
        name="q"
        size="30"
      />
      <br/>
      Display fields:
      <input 
        title="Display fields" 
        placeholder='e.g. 100,245' 
        type="text" 
        id="displayFields"
        name="displayFields"
        size="30"
        value="100,245"
      />
      <br/>
      <label class='plugin-only' for='maxRecs'>Maximum records:</label>
      <input 
        title="Maximum Records"
        type="text"
        id="maxRecs"
        class='plugin-only'
        name="maxRecs"
        size="10"
        value="100"
      />
      </p>
      <p><button id="submit" type="submit">Search</button></p>
    </form>
    <p id='resultCount'></p>
    <p id='navigation'></p>
    <p id='results'></p>
    <script src ="./webrenderer.js" type="application/javascript"></script>
  </body>
</html>
