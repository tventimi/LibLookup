<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>LibLookup</title>
  </head>
  <body>
    <h3>LibLookup</h3>
    <form id="queryForm">
      <p><label>Enter ID:</label></p>
      <p>
      <input 
        title="Z39.50 query string" 
        placeholder='OCLC #' 
        type="text" 
        id="queryString"
        name="q"
        size="20"
      />
      </p>
      <p><button id="submit" type="submit">Search</button></p>
    </form>
    <p id='results'>
      <script src ="./renderer.js"></script>
    </p>
  </body>
</html>
