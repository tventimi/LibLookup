<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="./style.css" type="text/css"/>
    <title>LibLookup</title>
  </head>
  <body>
    <h3>LibLookup</h3>
    <form id="queryForm">
      <p>Catalog:
        <select title="Catalog" name="catalog" id="catalog">
          <option value="WorldCat">WorldCat</option>
          <option value="OCLCAuthorities">OCLC Authorities</option>
          <option value="AlmaProd">Alma Production</option>
          <option value="AlmaSand">Alma Sandbox</option>
          <option value="LCCAT">LC Catalog</option>
          <option value="LCNAF">LC Name Authority File</option>
          <option value="LCSAF">LC Subject Authority File</option>
      </select>
      <input 
        title="Z39.50 query string" 
        placeholder='Keyword or Z39.50 query string' 
        type="text" 
        id="queryString"
        name="q"
        size="50"
      />
      </p>
      <p><button id="submit" type="submit">Search</button></p>
    </form>
    <p id='results'></p>
    <script src ="./renderer.js" type="application/javascript"></script>
  </body>
</html>
